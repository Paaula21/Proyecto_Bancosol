<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Cambiar la hiperreferencia a la correcta -->
        <link rel="stylesheet" href="Login.css">
        <title>Ventana de inicio</title>
</head>
<body>
        <h1>Inicio de sesión</h1>
        <fieldset class="cuadro-login">
                <form class="formulario-login">
                        <label for="username">Nombre de usuario</label><br>
                        <input type="text" id="username" name="username" placeholder="Ej: Cristóbal" required /><br><br>

                        <label for="password">Contraseña</label><br>
                        <input type="password" id="password" name="password" required /><br><br>

                        <button type="submit">Inicio de sesión</button>
                </form>
        </fieldset>
</body>
</html>
